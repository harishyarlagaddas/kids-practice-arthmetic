AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'practice-my-kid-apis

  Sample SAM Template for practice-my-kid-apis

  '
Globals:
  Function:
    Timeout: 30
Resources:
