AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  practice-my-kid-apis

  Sample SAM Template for practice-my-kid-apis

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30

Resources:
  PracticeMyKidFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: practice-my-kid/
      Description: PracticeMyKid api endpoints of PracticeMyKid application
      Handler: app.lambda_handler
      Runtime: python3.6
      MemorySize: 128
      Role: arn:aws:iam::334612759319:role/practice-my-kid
      Tags:
        Name: practice-my-kid-apis
      AutoPublishAlias: Production
      Events:
        postApi:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /practice-my-kid/{api+}
            Method: post
        getApi:
          Type: Api
          Properties:
            Path: /practice-my-kid/{api+}
            Method: get
        optionsApi:
          Type: Api
          Properties:
            Path: /practice-my-kid/{api+}
            Method: options
      DeploymentPreference:
        #Type: Linear10PercentEvery3Minutes